name: daily-data
on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - run: node scripts/fetch-kopis.mjs
        continue-on-error: true
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      - run: node scripts/fetch-charlotte.mjs
        continue-on-error: true
      - run: node scripts/fetch-melon.mjs
        continue-on-error: true
      - run: node scripts/fetch-ticketlink.mjs
        continue-on-error: true
      - run: node scripts/fetch-casting-images.mjs
        continue-on-error: true
      - run: npm install --no-save --no-audit --no-fund sharp # 긴 상세 이미지를 조각내는 데 쓴다
        continue-on-error: true
      - run: node scripts/extract-casting-images.mjs
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casting-source-images
          path: .cache/casting-images
          if-no-files-found: ignore
          retention-days: 7
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: KOPIS 갱신"
          git pull --rebase
          git push

