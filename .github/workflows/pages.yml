name: deploy-pages
# 사이트는 Vercel(musical-moa.vercel.app)로 옮겼다. 예전 GitHub Pages 주소는 새 주소로 넘겨 주는 한 장짜리 페이지만 남긴다.
on:
  push:
    branches: [main]
    paths: [pages-redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
