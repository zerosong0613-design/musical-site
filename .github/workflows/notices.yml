name: casting-notices
on:
  schedule:
    - cron: '0 1,4,7,10,13 * * *' # 10·13·16·19·22시 KST. 최신 10개만 보이므로 하루 여러 번 확인한다.
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-notices.mjs
        continue-on-error: true
      - run: node scripts/fetch-openings.mjs
        continue-on-error: true
      - run: node --test tests/*.test.mjs
      - run: node scripts/fetch-announcements.mjs
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: 캐스팅 공지 갱신"
          git pull --rebase
          git push
